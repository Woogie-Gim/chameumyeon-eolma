<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  /* OG 카드 원본. scripts/make-icons.ts가 1200x630으로 캡처 */
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; display: flex; align-items: center; gap: 64px; padding: 0 96px; box-sizing: border-box;
    background: #f7f4ee; color: #1e2a2c; font-family: system-ui, -apple-system, 'Malgun Gothic', sans-serif; }
  .icon { width: 260px; height: 260px; flex: none; }
  h1 { font-size: 96px; margin: 0 0 24px; letter-spacing: -2px; }
  p { font-size: 38px; margin: 0 0 16px; color: #5f6b6d; line-height: 1.35; }
  small { font-size: 24px; color: #5f6b6d; }
  .coins { display: flex; gap: 10px; margin-top: 28px; align-items: flex-end; }
  .coins i { width: 46px; border-radius: 6px; background: #e0b04a; border: 2px solid #b98a2a; display: block; }
</style>
</head>
<body>
  <img class="icon" src="../../public/favicon.svg" alt="">
  <div>
    <h1>참으면 얼마?</h1>
    <p>사려던 금액을 가정 이율과<br>과거 상승률로 환산해 보는 앱</p>
    <small>가정 시뮬레이션이며 수익을 보장하지 않습니다.</small>
    <div class="coins"><i style="height:30px"></i><i style="height:50px"></i><i style="height:74px"></i><i style="height:102px"></i></div>
  </div>
</body>
</html>
